[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chadasg-rateskew"
version = "0.1.0"
description = "解析时间标记，排列日志采样率的一致性的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "chadasg" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://chadasg.github.io"
Repository = "https://github.com/chadasg/rateskew"
Issues = "https://github.com/chadasg/rateskew/issues"

[project.scripts]
rateskew = "rateskew:main"

[tool.setuptools]
py-modules = ["rateskew"]
